# Template for sensitive config. This file is safe to commit — it holds only
# placeholders. The REAL file (secret.yaml, with actual credentials) is
# git-ignored — see ingress/README.md for how to create it.
#
#   cp ingress/secret.example.yaml ingress/secret.yaml
#   # then edit ingress/secret.yaml with real values
#
# Using `stringData` means you type plain values here (not pre-base64'd);
# Kubernetes stores them base64-encoded internally, but that is NOT
# encryption — enable EKS Secrets encryption (KMS) or use something like
# AWS Secrets Manager / External Secrets Operator for real production
# credentials instead of raw Kubernetes Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: default
type: Opaque
stringData:
  DB_USER: "changeme"
  DB_PASSWORD: "changeme"
  DB_URL: "postgres://changeme:changeme@myapp-db.example.com:5432/myapp"
